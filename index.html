
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Cozy Library | Book Search</title>
  
<style>
  :root {
    --forest: #243b32;
    --forest-dark: #172820;
    --parchment: #f3ead8;
    --gold: #c5a46d;
    --muted: #b7b9a9;
  }

  body {
    background-color: var(--forest-dark);
    color: var(--parchment);
    font-family: Georgia, serif;
    margin: 0;
    padding: 40px 24px;
    text-align: center;
  }

  h1 {
    color: var(--gold);
    font-size: 36px;
    letter-spacing: 1px;
  }

  p {
    color: var(--muted);
    font-size: 18px;
  }

.search-container {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 32px auto;
  max-width: 650px;
  flex-wrap: wrap;
}

#bookSearch {
  flex: 1;
  min-width: 220px;
  padding: 15px;
  border: 1px solid var(--gold);
  border-radius: 8px;
  background: var(--parchment);
  color: var(--forest-dark);
  font-family: Georgia, serif;
  font-size: 16px;
}

#searchButton {
  padding: 15px 24px;
  background: var(--gold);
  color: var(--forest-dark);
  border: none;
  border-radius: 8px;
  font-family: Georgia, serif;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#searchButton:hover {
  background: #dfc18b;
}

#searchResults {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 24px;
  max-width: 1100px;
  margin: 40px auto;
  text-align: left;
}

.book-card {
  background: var(--forest);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 18px;
  text-align: center;
}

.book-card img {
  width: 100%;
  max-width: 150px;
  height: 220px;
  object-fit: contain;
  border-radius: 5px;
}

.book-card h3 {
  color: var(--parchment);
  font-size: 18px;
  margin: 14px 0 8px;
}

.book-card p {
  color: var(--muted);
  font-size: 14px;
  margin: 6px 0;
}

.select-edition {
  background: var(--gold);
  color: var(--forest-dark);
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  margin-top: 16px;
  font-family: Georgia, serif;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
}

.select-edition:hover {
  background: #dfc18b;
}

.select-edition:focus-visible {
  outline: 3px solid var(--parchment);
  outline-offset: 3px;
}

#selectedEdition {
  max-width: 650px;
  margin: 40px auto;
  padding: 28px;
  background: var(--forest);
  border: 2px solid var(--gold);
  border-radius: 14px;
  text-align: center;
}

#selectedEdition[hidden] {
  display: none;
}

#selectedEdition h2 {
  color: var(--gold);
  font-size: 26px;
}

#selectedEditionDetails img {
  width: 160px;
  max-width: 100%;
  border-radius: 6px;
  margin: 16px auto;
}

#selectedEditionDetails p {
  font-size: 15px;
  line-height: 1.6;
}

#addToLibraryButton {
  background: var(--gold);
  color: var(--forest-dark);
  border: none;
  border-radius: 8px;
  padding: 14px 24px;
  margin-top: 20px;
  font-family: Georgia, serif;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#addToLibraryButton:hover:not(:disabled) {
  background: #dfc18b;
}

#addToLibraryButton:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

</style>

</head>
<body>
  <h1>The Cozy Library</h1>
  <p>Find your next great read.</p>
  
<div class="search-container">
  <input
    type="text"
    id="bookSearch"
    placeholder="Search by title, author, or ISBN..."
    aria-label="Search for a book"
  >
  <button type="button" id="searchButton">
    Search Books
  </button>
</div>

<div id="searchResults" aria-live="polite"></div>

<section id="selectedEdition" hidden>
  <h2>🕯️ Your Selected Edition</h2>
  <div id="selectedEditionDetails"></div>
  
<button id="addToLibraryButton" type="button" disabled>
  Add to My Library
</button>

</section>

<script>
  const searchInput = document.getElementById("bookSearch");
  const searchButton = document.getElementById("searchButton");
  const searchResults = document.getElementById("searchResults");
  const addToLibraryButton = document.getElementById("addToLibraryButton");
  let selectedBook = null;

  async function searchBooks() {
    const query = searchInput.value.trim();

    if (!query) {
      searchResults.textContent = "Please enter a title, author, or ISBN.";
      return;
    }

    searchResults.textContent = "Searching the library...";
    searchButton.disabled = true;

    try {
      const isISBN = /^(?:\d{10}|\d{13})$/.test(
        query.replace(/[-\s]/g, "")
      );

      const cleanISBN = query.replace(/[-\s]/g, "");

      const url = isISBN
        ? `https://openlibrary.org/search.json?isbn=${encodeURIComponent(cleanISBN)}&limit=12`
        : `https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=12`;

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Book search failed");
      }

      const data = await response.json();
      searchResults.replaceChildren();

      if (!data.docs || data.docs.length === 0) {
        searchResults.textContent = "No books found. Try another search.";
        return;
      }

      data.docs.forEach(book => {
        const workKey = book.key;
        const card = document.createElement("div");
        card.className = "book-card";
        
        card.style.cursor = "pointer";
        
        card.addEventListener("click", () => {
          if (workKey) {
            showEditions(workKey, book.title, book.author_name?.[0] || "Unknown Author");
          }
        });


        const cover = document.createElement("img");
        cover.alt = `Cover of ${book.title || "book"}`;
        cover.loading = "lazy";
        cover.src = book.cover_i
          ? `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`
          : "https://placehold.co/150x220/243b32/f3ead8?text=No+Cover";

        const title = document.createElement("h3");
        title.textContent = book.title || "Untitled";

        const author = document.createElement("p");
        author.textContent = book.author_name?.join(", ") || "Unknown author";

        const year = document.createElement("p");
        year.textContent = book.first_publish_year || "Year unknown";

        card.append(cover, title, author, year);
        searchResults.appendChild(card);
      });
    } catch (error) {
      searchResults.textContent =
        "Something went wrong. Please try again.";
      console.error(error);
    } finally {
      searchButton.disabled = false;
    }
  }

  searchButton.addEventListener("click", searchBooks);

  searchInput.addEventListener("keydown", event => {
    if (event.key === "Enter") searchBooks();
  });
  
async function showEditions(workKey, bookTitle, bookAuthor) {
  searchResults.textContent = "Finding editions of " + bookTitle + "...";

  try {
    const response = await fetch(
      `https://openlibrary.org${workKey}/editions.json?limit=24`
    );

    if (!response.ok) {
      throw new Error("Could not load editions");
    }

    const data = await response.json();
    searchResults.replaceChildren();

    const heading = document.createElement("h2");
    heading.textContent = `Choose an edition of ${bookTitle}`;
    heading.style.gridColumn = "1 / -1";
    searchResults.appendChild(heading);

    data.entries.forEach(edition => {
      const card = document.createElement("div");
      card.className = "book-card";

      const cover = document.createElement("img");
      cover.alt = `Cover of ${edition.title || bookTitle}`;
      cover.loading = "lazy";
      cover.src = edition.covers?.[0]
        ? `https://covers.openlibrary.org/b/id/${edition.covers[0]}-M.jpg`
        : "https://placehold.co/150x220/243b32/f3ead8?text=No+Cover";

      const title = document.createElement("h3");
      title.textContent = edition.title || bookTitle;

      const details = document.createElement("p");
      details.textContent = [
        edition.publish_date,
        edition.number_of_pages
          ? `${edition.number_of_pages} pages`
          : null,
        edition.isbn_13?.[0] || edition.isbn_10?.[0]
      ].filter(Boolean).join(" • ");

const selectButton = document.createElement("button");
selectButton.type = "button";
selectButton.textContent = "Select This Edition";
selectButton.className = "select-edition";

selectButton.addEventListener("click", () => {
selectedBook = {
  editionId: edition.key.split("/").pop(),
  title: edition.title || bookTitle,
  author: bookAuthor,
  isbn: edition.isbn_13?.[0] || edition.isbn_10?.[0] || "",
  pages: edition.number_of_pages || null,
  readingStatus: "Want to Read"
};
  
const preview = document.getElementById("selectedEdition");
const details = document.getElementById("selectedEditionDetails");

details.replaceChildren();

const selectedCover = document.createElement("img");
selectedCover.src = cover.src;
selectedCover.alt = cover.alt;

const selectedTitle = document.createElement("h3");
selectedTitle.textContent = edition.title || bookTitle;

const selectedInfo = document.createElement("p");
selectedInfo.textContent = [
  edition.publish_date,
  edition.number_of_pages
    ? `${edition.number_of_pages} pages`
    : null,
  edition.isbn_13?.[0] || edition.isbn_10?.[0]
].filter(Boolean).join(" • ");

details.append(selectedCover, selectedTitle, selectedInfo);

preview.hidden = false;
addToLibraryButton.disabled = false;
preview.scrollIntoView({ behavior: "smooth", block: "start" });

});
     card.append(cover, title, details, selectButton);
      searchResults.appendChild(card);
    });
  } catch (error) {
    searchResults.textContent =
      "Could not load editions. Please try again.";
    console.error(error);
  }
}
addToLibraryButton.addEventListener("click", async () => {
  if (!selectedBook) return;

let importPassword = sessionStorage.getItem("cozyLibraryImportPassword");

if (!importPassword) {
  importPassword = prompt("Enter your Cozy Library import password:");
  if (!importPassword) return;
}

if (!importPassword) return;
  try{
  const response = await fetch(
  "https://the-cozy-library-api.lindsey-cooley87.workers.dev/",
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Import-Password": importPassword
    },
    body: JSON.stringify({
      action: "importEdition",
      ...selectedBook
    })
  }
);
 
if (response.status === 401) {
  sessionStorage.removeItem("cozyLibraryImportPassword");
  alert("Your import password was incorrect. Please try again.");
  return;
}


if (response.status === 409) {
  sessionStorage.setItem("cozyLibraryImportPassword", importPassword);
  alert("📚 This edition is already in your library!");
  return;
}


if (!response.ok) {
  alert("Something went wrong with the import. Please try again.");
  return;
}

sessionStorage.setItem("cozyLibraryImportPassword", importPassword);
alert("Your book import request was sent!");

} catch (error) {
  console.error("Import error:", error);
  alert("Could not connect to The Cozy Library. Please try again.");
}
});
</script>

</body>
</html>
