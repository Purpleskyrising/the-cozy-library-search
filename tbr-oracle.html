
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The TBR Oracle | The Cozy Library</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #241c19;
      color: #f1e4cc;
      font-family: Georgia, serif;
      text-align: center;
    }

    h1 {
      color: #d4b477;
      font-size: 28px;
    }

    p {
      color: #c9bba6;
      line-height: 1.6;
    }
    
.oracle-card {
  max-width: 420px;
  margin: 32px auto;
  padding: 32px 24px;
  background: linear-gradient(145deg, #382126, #21191c);
  border: 2px solid #b99559;
  border-radius: 18px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
}

.oracle-symbol {
  font-size: 42px;
  color: #d4b477;
  margin-bottom: 18px;
}

.oracle-card h2 {
  color: #e4c88f;
  font-size: 23px;
  font-weight: normal;
}

#choose-button {
  margin-top: 20px;
  padding: 14px 26px;
  background: #b99559;
  color: #21191c;
  border: none;
  border-radius: 30px;
  font-family: Georgia, serif;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#choose-button:hover {
  background: #e4c88f;
}

.book-reveal {
  margin-top: 28px;
  padding: 24px 16px;
  border: 1px solid #b99559;
  border-radius: 12px;
  background: rgba(20, 12, 18, 0.55);
  animation: revealMagic 0.8s ease-out;
}

.book-reveal[hidden] {
  display: none;
}

.reveal-stars {
  color: #d4b477;
  font-size: 24px;
  letter-spacing: 6px;
  margin-bottom: 20px;
}

#book-cover {
  display: block;
  width: 155px;
  max-width: 100%;
  margin: 0 auto 20px;
  border: 3px solid #b99559;
  border-radius: 5px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
}

.fortune-label {
  color: #d4b477;
  font-size: 11px;
  letter-spacing: 3px;
}

#book-title {
  color: #f1e4cc;
  font-size: 24px;
  font-weight: normal;
}

#book-author {
  color: #c9bba6;
  font-style: italic;
}

@keyframes revealMagic {
  from {
    opacity: 0;
    transform: translateY(15px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

#again-button {
  display: block;
  margin: 16px auto 0;
  padding: 12px 24px;
  background: transparent;
  color: #e4c88f;
  border: 1px solid #b99559;
  border-radius: 30px;
  font-family: Georgia, serif;
  font-size: 15px;
  cursor: pointer;
}

#again-button:hover {
  background: rgba(185, 149, 89, 0.15);
}

#again-button[hidden] {
  display: none;
}

#choose-button[hidden] {
  display: none;
}

  </style>
</head>

<body>
  <h1>✦ The TBR Oracle ✦</h1>
  <p>When the shelves are full of possibilities,
     let fate choose your next adventure.</p>
  
<div class="oracle-card">
  <div class="oracle-symbol">✧ 📖 ✧</div>

  <h2>Your Next Adventure Awaits</h2>

  <p id="oracle-message">
    The shelves are whispering...
    Are you ready to discover your next read?
  </p>
  
<div id="book-reveal" class="book-reveal" hidden>
  <div class="reveal-stars">✦ ☽ ✧ ☾ ✦</div>

  <img id="book-cover" alt="Your chosen book cover">

  <p class="fortune-label">THE ORACLE HAS CHOSEN</p>

  <h3 id="book-title"></h3>
  <p id="book-author"></p>
</div>


  <button id="choose-button">
    ✦ Let Fate Decide ✦
  </button>
  
<button id="again-button" hidden>
  ☽ Choose Again ☾
</button>

</div>

<script>
  const chooseButton = document.getElementById("choose-button");
  const againButton = document.getElementById("again-button");
  const bookReveal = document.getElementById("book-reveal");

  function revealBook() {
    document.getElementById("book-title").textContent = "The Hobbit";
    document.getElementById("book-author").textContent = "J.R.R. Tolkien";

    const cover = document.getElementById("book-cover");
    cover.src = "https://covers.openlibrary.org/b/isbn/9780547928227-L.jpg";

    bookReveal.hidden = true;

    requestAnimationFrame(() => {
      bookReveal.hidden = false;
    });

    document.getElementById("oracle-message").textContent =
      "The stars have aligned. Your next adventure has been chosen.";

    chooseButton.hidden = true;
    againButton.hidden = false;
  }

  chooseButton.addEventListener("click", revealBook);
  againButton.addEventListener("click", revealBook);
</script>

</body>
</html>
